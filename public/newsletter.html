<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스페이스 레터 · 구독 관리</title>
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="/icons/icon-512.png" type="image/png">
  <style>
    :root { --ink:#e8eef7; --muted:#aebdd0; --blue:#5f8dff; --line:#3a4b63; --paper:#182333; --surface:#223044; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink); font-family:"Noto Sans KR","Pretendard",sans-serif; padding:24px 16px; }
    main { width:100%; max-width:520px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:28px; }
    .kicker { color:var(--blue); font-size:12px; font-weight:700; letter-spacing:1px; }
    h1 { margin:6px 0 12px; font-size:24px; }
    p { color:var(--muted); line-height:1.7; }
    button { width:100%; margin-top:12px; padding:13px; border:0; border-radius:10px; background:#1958e8; color:#fff; font:inherit; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.6; cursor:default; }
    .status { min-height:24px; margin-top:16px; color:var(--ink); }
    .status[data-error="true"] { color:#ff9c9c; }
    a { color:var(--blue); }
    #action.done, #action.done:disabled { background:#2e9e6e; border-color:#2e9e6e; color:#fff; opacity:1; cursor:default; }
  </style>
</head>
<body>
  <main>
    <div class="kicker">SPACE LETTER</div>
    <h1 id="title">스페이스 레터 구독 관리</h1>
    <p id="description">메일에 있는 링크로 이 페이지를 열어 주세요.</p>
    <button id="action" type="button" hidden></button>
    <p id="status" class="status" role="status"></p>
    <p><a href="/">스페이스 커뮤니티로 가기</a> · <a href="/privacy">개인정보처리방침</a></p>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const confirmToken = params.get('confirm');
      const unsubscribeToken = params.get('unsubscribe');
      history.replaceState(null, '', location.pathname);
      const title = document.getElementById('title');
      const description = document.getElementById('description');
      const button = document.getElementById('action');
      const status = document.getElementById('status');
      const mode = confirmToken ? 'confirm' : unsubscribeToken ? 'unsubscribe' : null;
      if (!mode) return;
      if (mode === 'confirm') {
        title.textContent = '구독을 확인해 주세요';
        description.textContent = '아래 버튼을 누르면 스페이스 레터 구독이 완료됩니다.';
        button.textContent = '구독 확인하기';
      } else {
        title.textContent = '수신거부';
        description.textContent = unsubscribeToken === 'preview' ? '미리보기용 링크입니다. 실제 메일의 수신거부 링크에서만 처리됩니다.' : '아래 버튼을 누르면 즉시 수신이 중단되고 이메일 주소가 삭제됩니다.';
        button.textContent = '수신거부하기';
      }
      button.hidden = unsubscribeToken === 'preview';
      const showDone = message => {
        title.textContent = '구독이 완료되었습니다';
        description.hidden = true;
        button.textContent = '✓ 구독완료';
        button.disabled = true;
        button.classList.add('done');
        button.hidden = false;
        status.dataset.error = 'false';
        status.textContent = message;
        try { localStorage.setItem('space-letter-subscribed', new Date().toISOString()); } catch { /* storage unavailable */ }
      };
      // 이미 확인을 마친 링크로 다시 열면 누르기 전부터 '구독완료'로 보여 준다.
      if (mode === 'confirm') {
        fetch('/api/newsletter/confirm-status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: confirmToken }) })
          .then(response => response.ok ? response.json() : null)
          .then(result => {
            if (result?.state === 'confirmed') showDone('이미 구독이 완료된 상태입니다. 매주 월요일 아침 7시에 스페이스 레터를 보내드려요.');
            else if (result?.state === 'invalid') {
              // 예전에 확인을 마친 링크(기록이 남지 않은 경우)이거나 잘못된 링크: 누를 버튼 대신 안내만 보여 준다.
              title.textContent = '이미 사용한 확인 링크입니다';
              description.textContent = '이 링크로 구독 확인을 이미 하셨다면 구독이 완료된 상태이니 그대로 두시면 됩니다. 아직 확인하지 않으셨다면 첫 화면에서 구독을 다시 신청해 주세요.';
              button.hidden = true;
            }
          })
          .catch(() => {});
      }
      button.addEventListener('click', async () => {
        button.disabled = true;
        status.dataset.error = 'false';
        status.textContent = '처리하고 있습니다.';
        try {
          const response = await fetch(mode === 'confirm' ? '/api/newsletter/confirm' : '/api/newsletter/unsubscribe', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: mode === 'confirm' ? confirmToken : unsubscribeToken }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || '처리하지 못했습니다.');
          status.textContent = result.message;
          if (mode === 'confirm') {
            // 버튼을 '✓ 구독완료'로 바꿔 보여 준다(이미 확인한 링크를 다시 눌러도 같다).
            button.textContent = '✓ 구독완료';
            button.disabled = true;
            button.classList.add('done');
          } else {
            button.hidden = true;
          }
          title.textContent = mode === 'confirm' ? '구독이 완료되었습니다' : '수신거부가 완료되었습니다';
          description.hidden = true;
          // 이 브라우저에 구독 상태를 기억해, 첫 화면의 '구독 신청' 안내를 더 이상 보여 주지 않는다.
          try {
            if (mode === 'confirm') localStorage.setItem('space-letter-subscribed', new Date().toISOString());
            else localStorage.removeItem('space-letter-subscribed');
          } catch { /* storage unavailable */ }
          if (mode === 'confirm') {
            status.textContent = `${result.message} 잠시 후 첫 화면으로 이동합니다.`;
            setTimeout(() => { location.href = '/'; }, 3500);
          }
        } catch (error) {
          status.dataset.error = 'true';
          status.textContent = error.message || '처리하지 못했습니다. 잠시 후 다시 시도해 주세요.';
          button.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
